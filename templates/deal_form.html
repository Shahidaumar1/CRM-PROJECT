{% extends "base.html" %}
{% block title %}{% if deal %}Edit Deal{% else %}New Deal{% endif %} — SoftAccess CRM{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{% if deal %}Edit Deal{% else %}New Deal{% endif %}</h1>
    <div class="sub">Fill in the deal's details</div>
  </div>
</div>

<div class="panel" style="max-width:640px;">
  <form method="POST">
    <div class="form-grid single">
      <div class="field">
        <label>Deal Title *</label>
        <input type="text" name="title" required value="{{ deal.title if deal else '' }}" placeholder="e.g. Website redesign package">
      </div>
      <div class="field">
        <label>Customer *</label>
        <select name="customer_id" required>
          <option value="">-- Select a customer --</option>
          {% for c in customers %}
          <option value="{{ c.id }}" {% if (deal and deal.customer_id==c.id) or (preselect and preselect==c.id) %}selected{% endif %}>{{ c.name }}{% if c.company %} — {{ c.company }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Value (Rs)</label>
        <input type="number" step="0.01" name="value" value="{{ deal.value if deal else 0 }}">
      </div>
      <div class="field">
        <label>Stage</label>
        <select name="stage">
          {% for s in stages %}
          <option value="{{ s }}" {% if deal and deal.stage==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Expected Close Date</label>
        <input type="date" name="expected_close" value="{{ deal.expected_close.isoformat() if deal and deal.expected_close else '' }}">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{% if deal %}Update{% else %}Add{% endif %}</button>
      <a href="{{ url_for('deals') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
