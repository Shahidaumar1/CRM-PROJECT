{% extends "base.html" %}
{% block title %}Login — SoftAccess CRM{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">S</span>
      <span class="name">SoftAccess CRM</span>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to your account.</p>
    <form method="POST">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@company.com" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <div class="auth-switch">Forgot your password? Ask your Admin to reset it.</div>
    <div class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register</a></div>
  </div>
</div>
{% endblock %}
